name: temporary-finalize-gateway

on:
  push:
    branches:
      - feat/agent-realtime-gateway-issue-257
    paths:
      - .github/workflows/temporary-finalize-gateway.yml
      - scripts/finalize_gateway.py

permissions:
  contents: write

concurrency:
  group: temporary-finalize-gateway
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/agent-realtime-gateway-issue-257
          fetch-depth: 0
          persist-credentials: true

      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.23.0"
          cache: false

      - name: Resolve immutable container bases
        shell: bash
        run: |
          set -Eeuo pipefail
          builder_digest="$(docker buildx imagetools inspect golang:1.23-alpine | awk '/^Digest:/ {print $2; exit}')"
          runtime_digest="$(docker buildx imagetools inspect gcr.io/distroless/static-debian12:nonroot | awk '/^Digest:/ {print $2; exit}')"
          [[ "${builder_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${runtime_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "BUILDER_DIGEST=${builder_digest}" >> "${GITHUB_ENV}"
          echo "RUNTIME_DIGEST=${runtime_digest}" >> "${GITHUB_ENV}"

      - name: Apply and certify the final gateway tree
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/finalize_gateway.py
          gofmt -w cmd/gateway/*.go
          go mod tidy
          go mod verify
          go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/gateway ./cmd/gateway
          docker build --pull=false -t "codestra-agent-realtime:${GITHUB_SHA}" .
          grep -R --fixed-strings "b39cdffe56a8185c91174228f0423df68b1137f34875f6ee52f9914f904bf724" cmd/gateway/main.go README.md
          ! grep -R --fixed-strings "856f55ce980fe661a6a326c1a70207496f0eb3fc4bc335141e874c075b5a7e93" cmd/gateway README.md
          grep -Eq '^FROM golang:1\.23-alpine@sha256:[0-9a-f]{64} AS build$' Dockerfile
          grep -Eq '^FROM gcr\.io/distroless/static-debian12:nonroot@sha256:[0-9a-f]{64}$' Dockerfile
          test -s go.sum
          git diff --check

      - name: Remove temporary automation and publish the certified commit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/temporary-finalize-gateway.yml
          rm -f .github/workflows/temporary-materialize-gateway.yml
          rm -f scripts/finalize_gateway.py
          rm -f .codestra/temporary-gateway-payload.b64
          rm -f .codestra/gateway-payload.part-aa
          git diff --check
          git config user.name "codestra-gateway-certifier"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(gateway): certify protected calling delivery"
          git push origin HEAD:feat/agent-realtime-gateway-issue-257
